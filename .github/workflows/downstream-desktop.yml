name: Downstream desktop approval trace
on:
  push:
    branches: ['agentbase/**']
    paths: ['desktop/**', 'pnpm-lock.yaml', '.github/workflows/downstream-desktop.yml']
  pull_request:
    branches: ['agentbase/main']
    paths: ['desktop/**', 'pnpm-lock.yaml', '.github/workflows/downstream-desktop.yml']
permissions:
  contents: read
jobs:
  trace:
    if: github.repository == 'Two-Weeks-Team/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
        working-directory: desktop
      - run: node --import ./test-loader.mjs --experimental-strip-types --test src/features/workflows/ui/approvalTrace.test.mjs
        working-directory: desktop
